<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Electric Purple-Blue Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 1px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #38bdf8;
      text-transform: uppercase;
    }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="320" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Backgrounds -->
  <circle cx="200" cy="100" r="180" fill="url(#orbPurple)" />
  <circle cx="800" cy="220" r="200" fill="url(#orbCyan)" />

  <!-- Grid Accent Lines -->
  <line x1="80" y1="230" x2="920" y2="230" stroke="#334155" stroke-opacity="0.4" stroke-dasharray="6,6" />

  <!-- App Logo / Bolt Symbol -->
  <g transform="translate(180, 75)" filter="url(#glow)">
    <path fill="url(#textGrad)" d="M42 2L6 44h30L22 78l48-46H40L54 2z" />
  </g>

  <!-- Main Title -->
  <text x="270" y="132" class="title">FLUX</text>

  <!-- Subtitle -->
  <text x="272" y="174" class="subtitle">Next-Gen Personal Cloud Storage &amp; Streaming Platform</text>

  <!-- Pill Badges -->
  <g transform="translate(272, 248)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="80" y="20" class="badge-text" text-anchor="middle">Liquid Glass UI</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="257" y="20" class="badge-text" text-anchor="middle">Supabase Engine</text>

    <!-- Pill 3 -->
    <rect x="355" y="0" width="145" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="427" y="20" class="badge-text" text-anchor="middle">24/7 Always-On</text>
  </g>
</svg>
